<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .hdr-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .hdr-subtitle { font-size: 13px; font-weight: 500; fill: #475569; }
      .badge-text { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .card-title { font-size: 14px; font-weight: 700; }
      .card-subtitle { font-size: 11px; font-weight: 600; }
      .bullet-item { font-size: 11px; font-weight: 400; fill: #334155; }
      .bullet-item-bold { font-weight: 600; }
      .conn-line { stroke: #94a3b8; stroke-width: 2.5; stroke-dasharray: 4,4; }
      .conn-line-solid { stroke: #059669; stroke-width: 2.5; }
    </style>

    <!-- Gradients for Cards -->
    <linearGradient id="card-m1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="card-m2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="card-m3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="card-m4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- Header Section -->
  <g transform="translate(530, 42)" text-anchor="middle">
    <text class="hdr-title" y="0">Integrated Housing Services and Monitoring System (IHSMS)</text>
    <text class="hdr-subtitle" y="24">Strategic Product Vision &amp; Multi-Phase Release Roadmap — Talisay City Housing Authority (THA)</text>
  </g>

  <!-- Connecting Lines Between Milestone Columns -->
  <!-- Card 1 to Card 2 -->
  <path d="M 265 285 L 295 285" class="conn-line-solid" marker-end="url(#arrow-green)"/>
  <!-- Card 2 to Card 3 -->
  <path d="M 525 285 L 555 285" class="conn-line" marker-end="url(#arrow-slate)"/>
  <!-- Card 3 to Card 4 -->
  <path d="M 785 285 L 815 285" class="conn-line" marker-end="url(#arrow-slate)"/>

  <!-- ==================== MILESTONE 1 (v1.0.0 CURRENT) ==================== -->
  <g transform="translate(35, 95)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="230" height="390" rx="10" fill="url(#card-m1)" stroke="#059669" stroke-width="2"/>
    
    <!-- Status Badge -->
    <rect x="14" y="14" width="75" height="20" rx="4" fill="#059669"/>
    <text class="badge-text" x="51.5" y="28" text-anchor="middle">RELEASED</text>

    <!-- Version Title -->
    <text class="card-title" x="14" y="55" fill="#064e3b">v1.0.0 — Production</text>
    <text class="card-subtitle" x="14" y="71" fill="#059669">CURRENT GA (2026)</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#a7f3d0" stroke-width="1"/>

    <!-- Features List -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#065f46">✓ Walk-in Intake:</tspan> Multi-layer rules</text>
    <text class="bullet-item" x="16" y="125"><tspan class="bullet-item-bold" fill="#065f46">✓ CDRRMO Check:</tspan> Hazard clearance</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#065f46">✓ Document Vault:</tspan> TWAIN &amp; Drive</text>
    <text class="bullet-item" x="16" y="165"><tspan class="bullet-item-bold" fill="#065f46">✓ PyMuPDF Forms:</tspan> 2-page THA PDF</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#065f46">✓ Lot Award Queue:</tspan> Raffle &amp; draw lots</text>
    <text class="bullet-item" x="16" y="205"><tspan class="bullet-item-bold" fill="#065f46">✓ Interactive Map:</tspan> SVG unit plots</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#065f46">✓ Unit Monitoring:</tspan> 30/60/90-day checks</text>
    <text class="bullet-item" x="16" y="245"><tspan class="bullet-item-bold" fill="#065f46">✓ Case Desk:</tspan> Dispute resolution &amp; log</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#065f46">✓ Semaphore SMS:</tspan> Auto-notifications</text>
    <text class="bullet-item" x="16" y="285"><tspan class="bullet-item-bold" fill="#065f46">✓ Public Tracker:</tspan> /status/&lt;ref&gt;/</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#065f46">✓ Role Security:</tspan> 4 desk &amp; field roles</text>
    <text class="bullet-item" x="16" y="325"><tspan class="bullet-item-bold" fill="#065f46">✓ Railway Cloud:</tspan> PostgreSQL + Assets</text>
  </g>

  <!-- ==================== MILESTONE 2 (v1.1.0 SHORT-TERM) ==================== -->
  <g transform="translate(295, 95)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="230" height="390" rx="10" fill="url(#card-m2)" stroke="#2563eb" stroke-width="1.8"/>
    
    <!-- Status Badge -->
    <rect x="14" y="14" width="80" height="20" rx="4" fill="#2563eb"/>
    <text class="badge-text" x="54" y="28" text-anchor="middle">SHORT-TERM</text>

    <!-- Version Title -->
    <text class="card-title" x="14" y="55" fill="#1e3a8a">v1.1.0 — Field PWA</text>
    <text class="card-subtitle" x="14" y="71" fill="#2563eb">TARGET: Q3 2026</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#bfdbfe" stroke-width="1"/>

    <!-- Features List -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#1e40af">📷 QR Unit Badging:</tspan> Weatherproof tags</text>
    <text class="bullet-item" x="16" y="125"><tspan class="bullet-item-bold" fill="#1e40af">🔍 In-Browser Scanner:</tspan> Camera audit</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#1e40af">🗺️ Drone Imagery:</tspan> Orthophoto map overlay</text>
    <text class="bullet-item" x="16" y="165"><tspan class="bullet-item-bold" fill="#1e40af">🚧 Encroachment Alert:</tspan> Boundary check</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#1e40af">📧 Scheduled SMS:</tspan> Automated cron alerts</text>
    <text class="bullet-item" x="16" y="205"><tspan class="bullet-item-bold" fill="#1e40af">📅 Inspection Reminders:</tspan> Direct notices</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#1e40af">📄 ReportLab Audits:</tspan> COA report PDFs</text>
    <text class="bullet-item" x="16" y="245"><tspan class="bullet-item-bold" fill="#1e40af">✒️ THA Header Stamps:</tspan> Official signatures</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#1e40af">📊 Multi-Format Export:</tspan> .xlsx, .csv, .pdf</text>
    <text class="bullet-item" x="16" y="285"><tspan class="bullet-item-bold" fill="#1e40af">👥 Household Audit:</tspan> Member validation</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#1e40af">⚡ Service Worker:</tspan> Client-side caching</text>
    <text class="bullet-item" x="16" y="325"><tspan class="bullet-item-bold" fill="#1e40af">📱 PWA Install Prompt:</tspan> Mobile home icon</text>
  </g>

  <!-- ==================== MILESTONE 3 (v1.2.0 MEDIUM-TERM) ==================== -->
  <g transform="translate(555, 95)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="230" height="390" rx="10" fill="url(#card-m3)" stroke="#7c3aed" stroke-width="1.8"/>
    
    <!-- Status Badge -->
    <rect x="14" y="14" width="85" height="20" rx="4" fill="#7c3aed"/>
    <text class="badge-text" x="56.5" y="28" text-anchor="middle">MEDIUM-TERM</text>

    <!-- Version Title -->
    <text class="card-title" x="14" y="55" fill="#4c1d95">v1.2.0 — Citizen &amp; Pay</text>
    <text class="card-subtitle" x="14" y="71" fill="#7c3aed">TARGET: Q4 2026</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#ddd6fe" stroke-width="1"/>

    <!-- Features List -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#5b21b6">🌐 Citizen Pre-Intake:</tspan> Online portal</text>
    <text class="bullet-item" x="16" y="125"><tspan class="bullet-item-bold" fill="#5b21b6">📱 Mobile Uploads:</tspan> Requirement snapshots</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#5b21b6">💳 Amortization Ledger:</tspan> Lot payments</text>
    <text class="bullet-item" x="16" y="165"><tspan class="bullet-item-bold" fill="#5b21b6">🧾 Official Receipts:</tspan> Balance statements</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#5b21b6">⚠️ Delinquency Alerts:</tspan> Automated escalation</text>
    <text class="bullet-item" x="16" y="205"><tspan class="bullet-item-bold" fill="#5b21b6">🏛️ CDRRMO API Sync:</tspan> Direct hazard feeds</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#5b21b6">📋 Assessor API Sync:</tspan> Property registry</text>
    <text class="bullet-item" x="16" y="245"><tspan class="bullet-item-bold" fill="#5b21b6">🔏 PKI Digital Sign:</tspan> Official award certs</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#5b21b6">🏢 Granular RBAC:</tspan> Section-level access</text>
    <text class="bullet-item" x="16" y="285"><tspan class="bullet-item-bold" fill="#5b21b6">🗣️ Bilingual Support:</tspan> Ilonggo &amp; English</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#5b21b6">🔒 Audit Cryptography:</tspan> Tamper-evident log</text>
    <text class="bullet-item" x="16" y="325"><tspan class="bullet-item-bold" fill="#5b21b6">📑 Batch PDF Signing:</tspan> Bulk approval</text>
  </g>

  <!-- ==================== MILESTONE 4 (v2.0.0 LONG-TERM) ==================== -->
  <g transform="translate(815, 95)" filter="url(#card-shadow)">
    <!-- Card Frame -->
    <rect width="230" height="390" rx="10" fill="url(#card-m4)" stroke="#d97706" stroke-width="1.8"/>
    
    <!-- Status Badge -->
    <rect x="14" y="14" width="90" height="20" rx="4" fill="#d97706"/>
    <text class="badge-text" x="59" y="28" text-anchor="middle">LONG-TERM</text>

    <!-- Version Title -->
    <text class="card-title" x="14" y="55" fill="#78350f">v2.0.0 — Native &amp; AI</text>
    <text class="card-subtitle" x="14" y="71" fill="#d97706">TARGET: 2027 VISION</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#fde68a" stroke-width="1"/>

    <!-- Features List -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#92400e">📱 Native Mobile App:</tspan> Flutter / React Nat.</text>
    <text class="bullet-item" x="16" y="125"><tspan class="bullet-item-bold" fill="#92400e">💾 Offline SQLite:</tspan> Field auto-reconnect</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#92400e">📍 GPS Geotagging:</tspan> Boundary verification</text>
    <text class="bullet-item" x="16" y="165"><tspan class="bullet-item-bold" fill="#92400e">⚡ WebSockets Alerts:</tspan> Django Channels</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#92400e">🚨 Live Emergency:</tspan> Field hazard warnings</text>
    <text class="bullet-item" x="16" y="205"><tspan class="bullet-item-bold" fill="#92400e">🤝 Inter-LGU Network:</tspan> Cross-city registry</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#92400e">🚫 Double-Dipping Check:</tspan> Multi-LGU audit</text>
    <text class="bullet-item" x="16" y="245"><tspan class="bullet-item-bold" fill="#92400e">🤖 Predictive AI:</tspan> Housing demand forecast</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#92400e">📊 Vulnerability Score:</tspan> Priority triage</text>
    <text class="bullet-item" x="16" y="285"><tspan class="bullet-item-bold" fill="#92400e">🔑 Open REST API:</tspan> Secure JWT endpoints</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#92400e">🌐 Smart City Bridge:</tspan> LGU central database</text>
    <text class="bullet-item" x="16" y="325"><tspan class="bullet-item-bold" fill="#92400e">☁️ Multi-Region DB:</tspan> Failover redundancy</text>
  </g>

</svg>
