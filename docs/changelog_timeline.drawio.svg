<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 460" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .ms-tag { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .ms-title { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .ms-desc { font-size: 11px; font-weight: 400; fill: #475569; line-height: 1.4; }
      .date-tag { font-size: 10px; font-weight: 600; fill: #2563eb; }
      .timeline-bar { stroke: #cbd5e1; stroke-width: 4; stroke-linecap: round; }
      .timeline-node { fill: #2563eb; stroke: #ffffff; stroke-width: 3; }
    </style>
    <linearGradient id="tl-m1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="tl-m2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="tl-m3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="tl-m4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="tl-m5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="tl-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1020" height="460" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Banner -->
  <g transform="translate(36, 28)">
    <text x="0" y="22" class="title">System Milestone &amp; Release Timeline</text>
    <text x="0" y="42" class="subtitle">Architectural phases and feature progression culminating in IHSMS Version 1.0.0 Production Release</text>
  </g>

  <!-- Central Horizontal Timeline Axis -->
  <line x1="80" y1="120" x2="940" y2="120" class="timeline-bar"/>

  <!-- Milestone Node 1 -->
  <circle cx="120" cy="120" r="9" class="timeline-node"/>
  <!-- Milestone Node 2 -->
  <circle cx="310" cy="120" r="9" class="timeline-node"/>
  <!-- Milestone Node 3 -->
  <circle cx="500" cy="120" r="9" class="timeline-node"/>
  <!-- Milestone Node 4 -->
  <circle cx="690" cy="120" r="9" class="timeline-node"/>
  <!-- Milestone Node 5 (GA) -->
  <circle cx="880" cy="120" r="11" fill="#059669" stroke="#ffffff" stroke-width="3"/>

  <!-- Milestone Cards (5 columns) -->
  <!-- Card 1: Core Foundation -->
  <g transform="translate(36, 155)" filter="url(#tl-shadow)">
    <rect width="175" height="265" rx="10" fill="url(#tl-m1)" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="9" fill="#2563eb"/>
    <text x="42" y="24" class="ms-tag" text-anchor="middle">STAGE 1</text>
    <text x="12" y="48" class="ms-title">Foundation &amp; Auth</text>
    <text x="12" y="64" class="date-tag">Architecture</text>
    <text x="12" y="86" class="ms-desc">• Django 6.0 + PostgreSQL</text>
    <text x="12" y="104" class="ms-desc">• Tailwind CSS 4 CLI build</text>
    <text x="12" y="122" class="ms-desc">• Custom User &amp; Barangay</text>
    <text x="12" y="140" class="ms-desc">• Portal role middleware</text>
    <text x="12" y="158" class="ms-desc">• Google OAuth 2.0 allauth</text>
    <text x="12" y="176" class="ms-desc">• WhiteNoise static assets</text>
    <text x="12" y="194" class="ms-desc">• Clean MVT design layout</text>
  </g>

  <!-- Card 2: Intake & Vault -->
  <g transform="translate(226, 155)" filter="url(#tl-shadow)">
    <rect width="175" height="265" rx="10" fill="url(#tl-m2)" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="9" fill="#7c3aed"/>
    <text x="42" y="24" class="ms-tag" text-anchor="middle">STAGE 2</text>
    <text x="12" y="48" class="ms-title">Intake &amp; Vault</text>
    <text x="12" y="64" class="date-tag" fill="#7c3aed">Applicant Data</text>
    <text x="12" y="86" class="ms-desc">• Walk-in citizen intake</text>
    <text x="12" y="104" class="ms-desc">• Biometric &amp; household data</text>
    <text x="12" y="122" class="ms-desc">• Reference code generation</text>
    <text x="12" y="140" class="ms-desc">• CDRRMO categorization</text>
    <text x="12" y="158" class="ms-desc">• DWT TWAIN scanner bridge</text>
    <text x="12" y="176" class="ms-desc">• 7-point checklist tracker</text>
    <text x="12" y="194" class="ms-desc">• Secure document vault</text>
  </g>

  <!-- Card 3: Eligibility & Forms -->
  <g transform="translate(416, 155)" filter="url(#tl-shadow)">
    <rect width="175" height="265" rx="10" fill="url(#tl-m3)" stroke="#a5f3fc" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="9" fill="#0891b2"/>
    <text x="42" y="24" class="ms-tag" text-anchor="middle">STAGE 3</text>
    <text x="12" y="48" class="ms-title">Eligibility &amp; PDF</text>
    <text x="12" y="64" class="date-tag" fill="#0891b2">Evaluation</text>
    <text x="12" y="86" class="ms-desc">• Standardized criteria scoring</text>
    <text x="12" y="104" class="ms-desc">• Pre-check summary review</text>
    <text x="12" y="122" class="ms-desc">• Three-way review triage</text>
    <text x="12" y="140" class="ms-desc">• PyMuPDF form injection</text>
    <text x="12" y="158" class="ms-desc">• THA 2-page PDF generation</text>
    <text x="12" y="176" class="ms-desc">• Physical sign-off workflow</text>
    <text x="12" y="194" class="ms-desc">• Digital re-scan archiving</text>
  </g>

  <!-- Card 4: Award & SMS -->
  <g transform="translate(606, 155)" filter="url(#tl-shadow)">
    <rect width="175" height="265" rx="10" fill="url(#tl-m4)" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="12" y="12" width="60" height="18" rx="9" fill="#d97706"/>
    <text x="42" y="24" class="ms-tag" text-anchor="middle">STAGE 4</text>
    <text x="12" y="48" class="ms-title">Award &amp; SMS</text>
    <text x="12" y="64" class="date-tag" fill="#d97706">Allocation</text>
    <text x="12" y="86" class="ms-desc">• Award ceremony queue</text>
    <text x="12" y="104" class="ms-desc">• Public lot drawing triage</text>
    <text x="12" y="122" class="ms-desc">• Orientation scheduling</text>
    <text x="12" y="140" class="ms-desc">• Twilio programmable SMS</text>
    <text x="12" y="158" class="ms-desc">• Automated venue dispatch</text>
    <text x="12" y="176" class="ms-desc">• Binding LotAward contracts</text>
    <text x="12" y="194" class="ms-desc">• Relocation site mapping</text>
  </g>

  <!-- Card 5: Version 1.0.0 Release -->
  <g transform="translate(796, 155)" filter="url(#tl-shadow)">
    <rect width="188" height="265" rx="10" fill="url(#tl-m5)" stroke="#a7f3d0" stroke-width="1.8"/>
    <rect x="12" y="12" width="80" height="18" rx="9" fill="#059669"/>
    <text x="52" y="24" class="ms-tag" text-anchor="middle">v1.0.0 GA</text>
    <text x="12" y="48" class="ms-title">Release &amp; Monitor</text>
    <text x="12" y="64" class="date-tag" fill="#059669">2026-10-12</text>
    <text x="12" y="86" class="ms-desc">• Unit occupancy lifecycle</text>
    <text x="12" y="104" class="ms-desc">• Interactive lot polygon map</text>
    <text x="12" y="122" class="ms-desc">• 30-day inspection visits</text>
    <text x="12" y="140" class="ms-desc">• Dispute case management</text>
    <text x="12" y="158" class="ms-desc">• Real-time KPI dashboard</text>
    <text x="12" y="176" class="ms-desc">• Year/Month dynamic filters</text>
    <text x="12" y="194" class="ms-desc">• Railway Cloud Production</text>
  </g>
</svg>
