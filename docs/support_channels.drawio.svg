<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .hdr-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .hdr-subtitle { font-size: 13px; font-weight: 500; fill: #475569; }
      .badge-text { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .card-title { font-size: 14px; font-weight: 700; }
      .card-subtitle { font-size: 11px; font-weight: 600; }
      .bullet-item { font-size: 11px; font-weight: 400; fill: #334155; }
      .bullet-item-bold { font-weight: 600; }
      .conn-line-blue { stroke: #2563eb; stroke-width: 2.5; }
      .conn-line-green { stroke: #059669; stroke-width: 2.5; }
      .conn-line-purple { stroke: #7c3aed; stroke-width: 2.5; }
    </style>

    <!-- Gradients for Cards -->
    <linearGradient id="card-t1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="card-t2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="card-t3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="card-t4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- Header Section -->
  <g transform="translate(530, 42)" text-anchor="middle">
    <text class="hdr-title" y="0">Integrated Housing Services and Monitoring System (IHSMS)</text>
    <text class="hdr-subtitle" y="24">Support Escalation Flow &amp; Institutional Channels — Talisay City Housing Authority (THA)</text>
  </g>

  <!-- Connecting Lines Between Tiers -->
  <!-- Tier 1 to Tier 2 -->
  <path d="M 265 285 L 295 285" class="conn-line-blue" marker-end="url(#arrow-blue)"/>
  <!-- Tier 2 to Tier 3 -->
  <path d="M 525 285 L 555 285" class="conn-line-green" marker-end="url(#arrow-green)"/>
  <!-- Tier 3 to Tier 4 -->
  <path d="M 785 285 L 815 285" class="conn-line-purple" marker-end="url(#arrow-purple)"/>

  <!-- ==================== TIER 1 (SELF-SERVICE DOCS) ==================== -->
  <g transform="translate(35, 95)" filter="url(#card-shadow)">
    <rect width="230" height="390" rx="10" fill="url(#card-t1)" stroke="#2563eb" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="14" y="14" width="70" height="20" rx="4" fill="#2563eb"/>
    <text class="badge-text" x="49" y="28" text-anchor="middle">TIER 1</text>

    <!-- Title -->
    <text class="card-title" x="14" y="55" fill="#1e3a8a">Self-Service Docs</text>
    <text class="card-subtitle" x="14" y="71" fill="#2563eb">FIRST INQUIRY STEP</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#bfdbfe" stroke-width="1"/>

    <!-- Content -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#1e40af">📖 INSTRUCTIONS.md</tspan></text>
    <text class="bullet-item" x="28" y="122">Local setup &amp; Windows guide</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#1e40af">🏗️ README.md</tspan></text>
    <text class="bullet-item" x="28" y="162">System overview &amp; endpoints</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#1e40af">📋 notes/user_guide.md</tspan></text>
    <text class="bullet-item" x="28" y="202">Staff role operations manual</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#1e40af">🌐 DEPLOYMENT.md</tspan></text>
    <text class="bullet-item" x="28" y="242">Railway &amp; Linux production</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#1e40af">⚙️ .env.example</tspan></text>
    <text class="bullet-item" x="28" y="282">Environment configurations</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#1e40af">📊 Dashboard Explainer</tspan></text>
    <text class="bullet-item" x="28" y="322">Analytics metrics &amp; definitions</text>
    <text class="bullet-item" x="16" y="345"><tspan class="bullet-item-bold" fill="#1e40af">🗂️ docs/ERD.md</tspan></text>
    <text class="bullet-item" x="28" y="362">Database schema reference</text>
  </g>

  <!-- ==================== TIER 2 (THA OPERATIONS) ==================== -->
  <g transform="translate(295, 95)" filter="url(#card-shadow)">
    <rect width="230" height="390" rx="10" fill="url(#card-t2)" stroke="#059669" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="14" y="14" width="70" height="20" rx="4" fill="#059669"/>
    <text class="badge-text" x="49" y="28" text-anchor="middle">TIER 2</text>

    <!-- Title -->
    <text class="card-title" x="14" y="55" fill="#064e3b">THA Operations</text>
    <text class="card-subtitle" x="14" y="71" fill="#059669">HOUSING DESK &amp; FIELD</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#a7f3d0" stroke-width="1"/>

    <!-- Content -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#065f46">🏢 City Hall Front Desk</tspan></text>
    <text class="bullet-item" x="28" y="122">Walk-in intake inquiries</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#065f46">🔍 Application Tracking</tspan></text>
    <text class="bullet-item" x="28" y="162">Citizen tracking reference checks</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#065f46">📑 Document Submissions</tspan></text>
    <text class="bullet-item" x="28" y="202">Physical requirement receipts</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#065f46">🎟️ Lot Awarding Queue</tspan></text>
    <text class="bullet-item" x="28" y="242">Draw-lots orientation queries</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#065f46">🏘️ Caretaker / Ronda</tspan></text>
    <text class="bullet-item" x="28" y="282">Site inspection field coordination</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#065f46">⚖️ Case Dispute Desk</tspan></text>
    <text class="bullet-item" x="28" y="322">Community mediation hearings</text>
    <text class="bullet-item" x="16" y="345"><tspan class="bullet-item-bold" fill="#065f46">📍 Talisay City Hall</tspan></text>
    <text class="bullet-item" x="28" y="362">Negros Occidental, Philippines</text>
  </g>

  <!-- ==================== TIER 3 (TECHNICAL & GITHUB) ==================== -->
  <g transform="translate(555, 95)" filter="url(#card-shadow)">
    <rect width="230" height="390" rx="10" fill="url(#card-t3)" stroke="#7c3aed" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="14" y="14" width="70" height="20" rx="4" fill="#7c3aed"/>
    <text class="badge-text" x="49" y="28" text-anchor="middle">TIER 3</text>

    <!-- Title -->
    <text class="card-title" x="14" y="55" fill="#4c1d95">Technical Support</text>
    <text class="card-subtitle" x="14" y="71" fill="#7c3aed">ENGINEERING &amp; GITHUB</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#ddd6fe" stroke-width="1"/>

    <!-- Content -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#5b21b6">🐛 GitHub Issue Tracker</tspan></text>
    <text class="bullet-item" x="28" y="122">Bugs, traceback logs &amp; features</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#5b21b6">📄 PyMuPDF PDF Engine</tspan></text>
    <text class="bullet-item" x="28" y="162">Coordinate calibrations</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#5b21b6">📱 Semaphore SMS API</tspan></text>
    <text class="bullet-item" x="28" y="202">Gateway token &amp; quota issues</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#5b21b6">🔑 Google OAuth Setup</tspan></text>
    <text class="bullet-item" x="28" y="242">Domain whitelist &amp; Drive picker</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#5b21b6">🗄️ Database Migrations</tspan></text>
    <text class="bullet-item" x="28" y="282">PostgreSQL schema syncing</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#5b21b6">🎓 CHMSU Dev Leads</tspan></text>
    <text class="bullet-item" x="28" y="322">Academic turnover team</text>
    <text class="bullet-item" x="16" y="345"><tspan class="bullet-item-bold" fill="#5b21b6">✉️ Email Contact</tspan></text>
    <text class="bullet-item" x="28" y="362">jtcoronel.chmsu@gmail.com</text>
  </g>

  <!-- ==================== TIER 4 (SECURITY POLICY) ==================== -->
  <g transform="translate(815, 95)" filter="url(#card-shadow)">
    <rect width="230" height="390" rx="10" fill="url(#card-t4)" stroke="#dc2626" stroke-width="1.8"/>
    
    <!-- Badge -->
    <rect x="14" y="14" width="70" height="20" rx="4" fill="#dc2626"/>
    <text class="badge-text" x="49" y="28" text-anchor="middle">TIER 4</text>

    <!-- Title -->
    <text class="card-title" x="14" y="55" fill="#7f1d1d">Security Policy</text>
    <text class="card-subtitle" x="14" y="71" fill="#dc2626">PRIVATE DISCLOSURE</text>

    <line x1="14" y1="83" x2="216" y2="83" stroke="#fecaca" stroke-width="1"/>

    <!-- Content -->
    <text class="bullet-item" x="16" y="105"><tspan class="bullet-item-bold" fill="#991b1b">🛡️ Private Reporting</tspan></text>
    <text class="bullet-item" x="28" y="122">DO NOT open public issues</text>
    <text class="bullet-item" x="16" y="145"><tspan class="bullet-item-bold" fill="#991b1b">🔒 Critical Vulnerabilities</tspan></text>
    <text class="bullet-item" x="28" y="162">Auth bypass &amp; privilege leaks</text>
    <text class="bullet-item" x="16" y="185"><tspan class="bullet-item-bold" fill="#991b1b">👥 Citizen Privacy</tspan></text>
    <text class="bullet-item" x="28" y="202">Beneficiary PII &amp; records</text>
    <text class="bullet-item" x="16" y="225"><tspan class="bullet-item-bold" fill="#991b1b">📜 SECURITY.md Policy</tspan></text>
    <text class="bullet-item" x="28" y="242">Strict compliance requirements</text>
    <text class="bullet-item" x="16" y="265"><tspan class="bullet-item-bold" fill="#991b1b">⏱️ Response Timelines</tspan></text>
    <text class="bullet-item" x="28" y="282">24h ack · 48h triage · 7d patch</text>
    <text class="bullet-item" x="16" y="305"><tspan class="bullet-item-bold" fill="#991b1b">🔐 PGP / Email Channel</tspan></text>
    <text class="bullet-item" x="28" y="322">Direct maintainer inbox</text>
    <text class="bullet-item" x="16" y="345"><tspan class="bullet-item-bold" fill="#991b1b">✉️ Security Team</tspan></text>
    <text class="bullet-item" x="28" y="362">jtcoronel.chmsu@gmail.com</text>
  </g>

</svg>
