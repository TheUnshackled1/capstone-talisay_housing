<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .stage-badge { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .node-title { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
      .desc-line { font-size: 11px; font-weight: 400; fill: #334155; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="pp-s1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="pp-s2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="pp-s3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="pp-s4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="pp-s5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <marker id="pp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <filter id="pp-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <text x="470" y="24" text-anchor="middle" class="title">Production Deployment Pipeline Stages</text>
    <text x="470" y="44" text-anchor="middle" class="subtitle">Integrated Housing Services and Monitoring System (IHSMS) · Talisay City Housing Authority (THA)</text>
  </g>

  <!-- Stage 1 -->
  <g transform="translate(30, 95)" filter="url(#pp-shadow)">
    <rect width="175" height="260" rx="12" fill="url(#pp-s1)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#3b82f6"/>
    <text x="47" y="24" text-anchor="middle" class="stage-badge">STAGE 1</text>
    <text x="12" y="52" class="node-title">Code Ingestion</text>

    <text x="12" y="80" class="desc-line">• Pull from GitHub</text>
    <text x="12" y="102" class="desc-line">• Branch: `main`</text>
    <text x="12" y="124" class="desc-line">• Load `.env` secrets</text>
    <text x="12" y="146" class="desc-line">• Verify clean git tree</text>
    <text x="12" y="168" class="desc-line">• Nixpacks / venv init</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 205 225 L 225 225" class="arrow" marker-end="url(#pp-arrow)"/>

  <!-- Stage 2 -->
  <g transform="translate(225, 95)" filter="url(#pp-shadow)">
    <rect width="175" height="260" rx="12" fill="url(#pp-s2)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#8b5cf6"/>
    <text x="47" y="24" text-anchor="middle" class="stage-badge">STAGE 2</text>
    <text x="12" y="52" class="node-title">Dependencies</text>

    <text x="12" y="80" class="desc-line">• Activate `venv`/`env`</text>
    <text x="12" y="102" class="desc-line">• `pip install -r reqs`</text>
    <text x="12" y="124" class="desc-line">• PyMuPDF &amp; Django 6</text>
    <text x="12" y="146" class="desc-line">• `npm install` tooling</text>
    <text x="12" y="168" class="desc-line">• Compile Tailwind 4</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 400 225 L 420 225" class="arrow" marker-end="url(#pp-arrow)"/>

  <!-- Stage 3 -->
  <g transform="translate(420, 95)" filter="url(#pp-shadow)">
    <rect width="175" height="260" rx="12" fill="url(#pp-s3)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#06b6d4"/>
    <text x="47" y="24" text-anchor="middle" class="stage-badge">STAGE 3</text>
    <text x="12" y="52" class="node-title">Database &amp; Sync</text>

    <text x="12" y="80" class="desc-line">• `manage.py migrate`</text>
    <text x="12" y="102" class="desc-line">• `createcachetable`</text>
    <text x="12" y="124" class="desc-line">• `setup_google_oauth`</text>
    <text x="12" y="146" class="desc-line">• Sync domain in DB</text>
    <text x="12" y="168" class="desc-line">• `clearsessions` clean</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 595 225 L 615 225" class="arrow" marker-end="url(#pp-arrow)"/>

  <!-- Stage 4 -->
  <g transform="translate(615, 95)" filter="url(#pp-shadow)">
    <rect width="175" height="260" rx="12" fill="url(#pp-s4)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#f59e0b"/>
    <text x="47" y="24" text-anchor="middle" class="stage-badge">STAGE 4</text>
    <text x="12" y="52" class="node-title">Static Assets</text>

    <text x="12" y="80" class="desc-line">• `collectstatic` run</text>
    <text x="12" y="102" class="desc-line">• Build `staticfiles/`</text>
    <text x="12" y="124" class="desc-line">• WhiteNoise middleware</text>
    <text x="12" y="146" class="desc-line">• Static directory map</text>
    <text x="12" y="168" class="desc-line">• Gzip / Brotli cache</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 790 225 L 810 225" class="arrow" marker-end="url(#pp-arrow)"/>

  <!-- Stage 5 -->
  <g transform="translate(810, 95)" filter="url(#pp-shadow)">
    <rect width="175" height="260" rx="12" fill="url(#pp-s5)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="70" height="18" rx="4" fill="#10b981"/>
    <text x="47" y="24" text-anchor="middle" class="stage-badge">STAGE 5</text>
    <text x="12" y="52" class="node-title">Reload &amp; Launch</text>

    <text x="12" y="80" class="desc-line">• Reload Web Tab / pool</text>
    <text x="12" y="102" class="desc-line">• Gunicorn workers run</text>
    <text x="12" y="124" class="desc-line">• Enforce HTTPS / SSL</text>
    <text x="12" y="146" class="desc-line">• `manage.py check`</text>
    <text x="12" y="168" class="desc-line">• Live verification</text>
  </g>
</svg>
