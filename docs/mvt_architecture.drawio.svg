<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .badge-tag { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .block-title { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .block-desc { font-size: 11px; font-weight: 400; fill: #475569; line-height: 1.4; }
      .flow-arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .feedback-arrow { stroke: #3b82f6; stroke-width: 2; stroke-dasharray: 4 4; fill: none; stroke-linecap: round; }
    </style>
    <linearGradient id="mvt-c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="mvt-c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="mvt-c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="mvt-c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="mvt-c5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <marker id="mvt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="mvt-blue-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <filter id="mvt-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="540" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(36, 30)">
    <text x="0" y="22" class="title">IHSMS Model-View-Template (MVT) Architecture</text>
    <text x="0" y="42" class="subtitle">Full-stack software engineering topology, static asset compilation, and database interactions</text>
  </g>

  <!-- Layer 1: Client & Presentation -->
  <g transform="translate(36, 95)" filter="url(#mvt-shadow)">
    <rect width="210" height="400" rx="12" fill="url(#mvt-c1)" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="10" fill="#2563eb"/>
    <text x="49" y="28" class="badge-tag" text-anchor="middle">CLIENT</text>
    <text x="14" y="58" class="block-title">Presentation &amp; UI</text>
    <text x="14" y="74" class="block-desc">Browser &amp; Hardware interfaces</text>

    <g transform="translate(14, 90)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🌐 Staff Web Portals</text>
      <text x="10" y="40" class="block-desc">Second/Fourth Member UI</text>
      <text x="10" y="52" class="block-desc">Field Inspector mobile web</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🎨 Tailwind CSS 4 CLI</text>
      <text x="10" y="40" class="block-desc">Compiled utility tokens</text>
      <text x="10" y="52" class="block-desc">Glassmorphic dashboard</text>
    </g>

    <g transform="translate(14, 230)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🖨️ Dynamic Web TWAIN</text>
      <text x="10" y="40" class="block-desc">Hardware scanner SDK</text>
      <text x="10" y="52" class="block-desc">Local client sandbox</text>
    </g>

    <g transform="translate(14, 300)">
      <rect width="182" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">⚡ Vanilla JS &amp; Fetch</text>
      <text x="10" y="40" class="block-desc">Interactive search filters</text>
      <text x="10" y="54" class="block-desc">Async document uploads</text>
      <text x="10" y="68" class="block-desc">Dynamic lot map polygons</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 246 295 L 280 295" class="flow-arrow" marker-end="url(#mvt-arrow)"/>

  <!-- Layer 2: Routing & Middleware -->
  <g transform="translate(285, 95)" filter="url(#mvt-shadow)">
    <rect width="210" height="400" rx="12" fill="url(#mvt-c2)" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="14" y="14" width="80" height="20" rx="10" fill="#7c3aed"/>
    <text x="54" y="28" class="badge-tag" text-anchor="middle">GATEWAY</text>
    <text x="14" y="58" class="block-title">Routing &amp; Security</text>
    <text x="14" y="74" class="block-desc">Request triage &amp; auth pipeline</text>

    <g transform="translate(14, 90)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🚀 Railway / Gunicorn</text>
      <text x="10" y="40" class="block-desc">WSGI application server</text>
      <text x="10" y="52" class="block-desc">Multi-worker concurrency</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">📦 WhiteNoise Engine</text>
      <text x="10" y="40" class="block-desc">STATIC_ROOT pipeline</text>
      <text x="10" y="52" class="block-desc">Gzip &amp; Brotli compression</text>
    </g>

    <g transform="translate(14, 230)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🛡️ Middleware Chain</text>
      <text x="10" y="40" class="block-desc">SecurityMiddleware</text>
      <text x="10" y="52" class="block-desc">CsrfViewMiddleware</text>
    </g>

    <g transform="translate(14, 300)">
      <rect width="182" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🔐 Portal Role Guard</text>
      <text x="10" y="40" class="block-desc">Allauth AccountMiddleware</text>
      <text x="10" y="54" class="block-desc">Portal role normalization</text>
      <text x="10" y="68" class="block-desc">Session cookie validator</text>
    </g>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 495 295 L 530 295" class="flow-arrow" marker-end="url(#mvt-arrow)"/>

  <!-- Layer 3: Views & Controller Logic -->
  <g transform="translate(535, 95)" filter="url(#mvt-shadow)">
    <rect width="210" height="400" rx="12" fill="url(#mvt-c3)" stroke="#a5f3fc" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="10" fill="#0891b2"/>
    <text x="49" y="28" class="badge-tag" text-anchor="middle">CONTROLLER</text>
    <text x="14" y="58" class="block-title">Django Views &amp; Logic</text>
    <text x="14" y="74" class="block-desc">Business rule orchestrator</text>

    <g transform="translate(14, 90)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">📋 Intake &amp; Eligibility</text>
      <text x="10" y="40" class="block-desc">Applicant registration</text>
      <text x="10" y="52" class="block-desc">Criteria scoring &amp; pre-check</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">📄 PyMuPDF PDF Engine</text>
      <text x="10" y="40" class="block-desc">In-memory form rendering</text>
      <text x="10" y="52" class="block-desc">THA form coordinate stream</text>
    </g>

    <g transform="translate(14, 230)">
      <rect width="182" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🏠 Units &amp; Lot Award</text>
      <text x="10" y="40" class="block-desc">Award queue scheduling</text>
      <text x="10" y="52" class="block-desc">30-day occupancy monitor</text>
    </g>

    <g transform="translate(14, 300)">
      <rect width="182" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">📱 Twilio SMS &amp; Logs</text>
      <text x="10" y="40" class="block-desc">Beneficiary text alerts</text>
      <text x="10" y="54" class="block-desc">Staff activity snapshots</text>
      <text x="10" y="68" class="block-desc">JSON API serialization</text>
    </g>
  </g>

  <!-- Connector 3 -> 4 -->
  <path d="M 745 295 L 780 295" class="flow-arrow" marker-end="url(#mvt-arrow)"/>

  <!-- Layer 4: Models & Persistence -->
  <g transform="translate(785, 95)" filter="url(#mvt-shadow)">
    <rect width="195" height="400" rx="12" fill="url(#mvt-c5)" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="10" fill="#059669"/>
    <text x="49" y="28" class="badge-tag" text-anchor="middle">STORAGE</text>
    <text x="14" y="58" class="block-title">Models &amp; Database</text>
    <text x="14" y="74" class="block-desc">Relational persistent store</text>

    <g transform="translate(14, 90)">
      <rect width="167" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🐘 PostgreSQL DB</text>
      <text x="10" y="40" class="block-desc">Railway primary database</text>
      <text x="10" y="52" class="block-desc">psycopg3 connection pool</text>
    </g>

    <g transform="translate(14, 160)">
      <rect width="167" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">🗂️ Core Models</text>
      <text x="10" y="40" class="block-desc">Applicant, Application</text>
      <text x="10" y="52" class="block-desc">HousingUnit, LotAward</text>
    </g>

    <g transform="translate(14, 230)">
      <rect width="167" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">📁 Document Vault</text>
      <text x="10" y="40" class="block-desc">Blob &amp; scan uploads</text>
      <text x="10" y="52" class="block-desc">RequirementSubmissions</text>
    </g>

    <g transform="translate(14, 300)">
      <rect width="167" height="80" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="22" class="block-title" font-size="12">⚖️ Case &amp; Audit Logs</text>
      <text x="10" y="40" class="block-desc">Case dispute actions</text>
      <text x="10" y="54" class="block-desc">StaffActivity records</text>
      <text x="10" y="68" class="block-desc">SMSLog dispatch history</text>
    </g>
  </g>
</svg>
