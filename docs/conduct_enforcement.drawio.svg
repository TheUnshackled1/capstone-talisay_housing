<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .step-num { font-size: 11px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .node-title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .node-desc { font-size: 12px; font-weight: 400; fill: #475569; line-height: 1.4; }
      .badge-text { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="grad-report" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="grad-review" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="grad-res" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 32)">
    <text x="0" y="24" class="title">Code of Conduct Enforcement Workflow</text>
    <text x="0" y="44" class="subtitle">Integrated Housing Services and Monitoring System (IHSMS) · Talisay City Housing Authority (THA)</text>
  </g>

  <!-- Step 1: Incident Report -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="260" height="150" rx="12" fill="url(#grad-report)" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="20" rx="10" fill="#2563eb"/>
    <text x="46" y="30" class="step-num" text-anchor="middle">STEP 1</text>
    <text x="16" y="58" class="node-title">Incident Reported</text>
    <text x="16" y="78" class="node-desc">Private email sent to maintainers</text>
    <text x="16" y="94" class="node-desc" font-weight="600" fill="#1e40af">jtcoronel.chmsu@gmail.com</text>
    <text x="16" y="112" class="node-desc">or direct outreach to THA</text>
    <text x="16" y="128" class="node-desc" fill="#64748b" font-size="11">Reporter privacy strictly protected</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 300 175 L 350 175" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Evaluation & Investigation -->
  <g transform="translate(360, 100)" filter="url(#shadow)">
    <rect width="270" height="150" rx="12" fill="url(#grad-review)" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="20" rx="10" fill="#7c3aed"/>
    <text x="46" y="30" class="step-num" text-anchor="middle">STEP 2</text>
    <text x="16" y="58" class="node-title">Review &amp; Assessment</text>
    <text x="16" y="78" class="node-desc">• Maintainers review circumstances</text>
    <text x="16" y="95" class="node-desc">• Gather evidence and context</text>
    <text x="16" y="112" class="node-desc">• Determine severity &amp; impact</text>
    <text x="16" y="129" class="node-desc">• Select appropriate guideline</text>
  </g>

  <!-- Connector 2 -> Step 3 Banner -->
  <path d="M 630 175 L 680 175" class="arrow" marker-end="url(#arrowhead)"/>

  <!-- Step 4: Resolution & Record (Moved to right column or bottom) -->
  <g transform="translate(690, 100)" filter="url(#shadow)">
    <rect width="270" height="150" rx="12" fill="url(#grad-res)" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="16" y="16" width="60" height="20" rx="10" fill="#059669"/>
    <text x="46" y="30" class="step-num" text-anchor="middle">FINAL</text>
    <text x="16" y="58" class="node-title">Resolution &amp; Follow-up</text>
    <text x="16" y="78" class="node-desc">• Communicated to affected parties</text>
    <text x="16" y="95" class="node-desc">• Action recorded for auditing</text>
    <text x="16" y="112" class="node-desc">• Community standards maintained</text>
    <text x="16" y="129" class="node-desc" fill="#047857" font-weight="600">Safe &amp; respectful environment</text>
  </g>

  <!-- Step 3: Enforcement Action Matrix (Wide Section) -->
  <g transform="translate(40, 290)">
    <rect width="920" height="280" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="24" y="34" class="node-title" font-size="16">STEP 3: Enforcement Guidelines Matrix</text>
    <text x="24" y="52" class="subtitle">Corrective action calibrated to the severity and repetition of the incident</text>

    <!-- Tier 1: Correction -->
    <g transform="translate(24, 70)">
      <rect width="205" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="12" y="12" width="84" height="20" rx="4" fill="#e2e8f0"/>
      <text x="54" y="26" class="badge-text" fill="#334155" text-anchor="middle">Tier 1</text>
      <text x="12" y="52" class="node-title" font-size="14" fill="#1e293b">1. Correction</text>
      <text x="12" y="74" class="node-desc" font-weight="600" fill="#0284c7">Private Warning</text>
      <text x="12" y="94" class="node-desc">Private written notice explaining violation and offering guidance on acceptable behavior.</text>
      <text x="12" y="160" class="node-desc" font-size="11" fill="#64748b">Low severity / First infraction</text>
    </g>

    <!-- Tier 2: Warning -->
    <g transform="translate(250, 70)">
      <rect width="205" height="180" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2"/>
      <rect x="12" y="12" width="84" height="20" rx="4" fill="#fef3c7"/>
      <text x="54" y="26" class="badge-text" fill="#b45309" text-anchor="middle">Tier 2</text>
      <text x="12" y="52" class="node-title" font-size="14" fill="#78350f">2. Warning</text>
      <text x="12" y="74" class="node-desc" font-weight="600" fill="#d97706">Formal Reprimand</text>
      <text x="12" y="94" class="node-desc">Formal warning with specific consequences for continued unacceptable actions.</text>
      <text x="12" y="160" class="node-desc" font-size="11" fill="#92400e">Repeated minor violations</text>
    </g>

    <!-- Tier 3: Temporary Ban -->
    <g transform="translate(476, 70)">
      <rect width="205" height="180" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
      <rect x="12" y="12" width="84" height="20" rx="4" fill="#ffedd5"/>
      <text x="54" y="26" class="badge-text" fill="#c2410c" text-anchor="middle">Tier 3</text>
      <text x="12" y="52" class="node-title" font-size="14" fill="#9a3412">3. Temporary Ban</text>
      <text x="12" y="74" class="node-desc" font-weight="600" fill="#ea580c">Suspension</text>
      <text x="12" y="94" class="node-desc">Temporary ban from interaction, discussions, issues, or commits for a specified duration.</text>
      <text x="12" y="160" class="node-desc" font-size="11" fill="#9a3412">Serious or continuous breach</text>
    </g>

    <!-- Tier 4: Permanent Ban -->
    <g transform="translate(702, 70)">
      <rect width="194" height="180" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
      <rect x="12" y="12" width="84" height="20" rx="4" fill="#fee2e2"/>
      <text x="54" y="26" class="badge-text" fill="#b91c1c" text-anchor="middle">Tier 4</text>
      <text x="12" y="52" class="node-title" font-size="14" fill="#991b1b">4. Permanent Ban</text>
      <text x="12" y="74" class="node-desc" font-weight="600" fill="#dc2626">Total Expulsion</text>
      <text x="12" y="94" class="node-desc">Permanent ban from public interaction and repository contribution.</text>
      <text x="12" y="160" class="node-desc" font-size="11" fill="#b91c1c">Egregious / unrepentant violations</text>
    </g>
  </g>

  <!-- Connective flow line from Step 2 down to Step 3 -->
  <path d="M 495 250 L 495 285" class="arrow" marker-end="url(#arrowhead)"/>
</svg>
