<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .step-badge { font-size: 9.5px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .node-title { font-size: 13px; font-weight: 700; fill: #0f172a; }
      .desc-line { font-size: 10.5px; font-weight: 400; fill: #334155; }
      .arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="lsp-s1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="lsp-s2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="lsp-s3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="lsp-s4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="lsp-s5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
    <linearGradient id="lsp-s6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <marker id="lsp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <filter id="lsp-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1020" height="400" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <g transform="translate(40, 25)">
    <text x="470" y="24" text-anchor="middle" class="title">Local Development Setup Pipeline (Windows)</text>
    <text x="470" y="44" text-anchor="middle" class="subtitle">Integrated Housing Services and Monitoring System (IHSMS) · Talisay City Housing Authority (THA)</text>
  </g>

  <!-- Step 1: Clone Repo -->
  <g transform="translate(20, 95)" filter="url(#lsp-shadow)">
    <rect width="145" height="260" rx="12" fill="url(#lsp-s1)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="10" y="12" width="60" height="18" rx="4" fill="#3b82f6"/>
    <text x="40" y="24" text-anchor="middle" class="step-badge">STEP 1</text>
    <text x="10" y="52" class="node-title">Clone Repo</text>

    <text x="10" y="80" class="desc-line">• Open PowerShell</text>
    <text x="10" y="102" class="desc-line">• git clone</text>
    <text x="10" y="124" class="desc-line">• cd capstone</text>
    <text x="10" y="146" class="desc-line">• Verify branch main</text>
    <text x="10" y="168" class="desc-line">• Check files</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 165 225 L 185 225" class="arrow" marker-end="url(#lsp-arrow)"/>

  <!-- Step 2: Env & Deps -->
  <g transform="translate(185, 95)" filter="url(#lsp-shadow)">
    <rect width="145" height="260" rx="12" fill="url(#lsp-s2)" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="10" y="12" width="60" height="18" rx="4" fill="#8b5cf6"/>
    <text x="40" y="24" text-anchor="middle" class="step-badge">STEP 2</text>
    <text x="10" y="52" class="node-title">Env &amp; Tooling</text>

    <text x="10" y="80" class="desc-line">• python -m venv</text>
    <text x="10" y="102" class="desc-line">• Activate venv</text>
    <text x="10" y="124" class="desc-line">• pip install -r reqs</text>
    <text x="10" y="146" class="desc-line">• npm install</text>
    <text x="10" y="168" class="desc-line">• Tailwind CSS 4</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 330 225 L 350 225" class="arrow" marker-end="url(#lsp-arrow)"/>

  <!-- Step 3: Config -->
  <g transform="translate(350, 95)" filter="url(#lsp-shadow)">
    <rect width="145" height="260" rx="12" fill="url(#lsp-s3)" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="10" y="12" width="60" height="18" rx="4" fill="#06b6d4"/>
    <text x="40" y="24" text-anchor="middle" class="step-badge">STEP 3</text>
    <text x="10" y="52" class="node-title">Configure .env</text>

    <text x="10" y="80" class="desc-line">• copy .env.example</text>
    <text x="10" y="102" class="desc-line">• Set SECRET_KEY</text>
    <text x="10" y="124" class="desc-line">• DB credentials</text>
    <text x="10" y="146" class="desc-line">• Semaphore SMS</text>
    <text x="10" y="168" class="desc-line">• Google OAuth</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 495 225 L 515 225" class="arrow" marker-end="url(#lsp-arrow)"/>

  <!-- Step 4: Database Prep -->
  <g transform="translate(515, 95)" filter="url(#lsp-shadow)">
    <rect width="145" height="260" rx="12" fill="url(#lsp-s4)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="10" y="12" width="60" height="18" rx="4" fill="#f59e0b"/>
    <text x="40" y="24" text-anchor="middle" class="step-badge">STEP 4</text>
    <text x="10" y="52" class="node-title">Database Prep</text>

    <text x="10" y="80" class="desc-line">• manage.py migrate</text>
    <text x="10" y="102" class="desc-line">• seed_requirements</text>
    <text x="10" y="124" class="desc-line">• createcachetable</text>
    <text x="10" y="146" class="desc-line">• Seed 27 barangays</text>
    <text x="10" y="168" class="desc-line">• Check schemas</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 660 225 L 680 225" class="arrow" marker-end="url(#lsp-arrow)"/>

  <!-- Step 5: Auth & Admin -->
  <g transform="translate(680, 95)" filter="url(#lsp-shadow)">
    <rect width="145" height="260" rx="12" fill="url(#lsp-s5)" stroke="#ec4899" stroke-width="1.5"/>
    <rect x="10" y="12" width="60" height="18" rx="4" fill="#ec4899"/>
    <text x="40" y="24" text-anchor="middle" class="step-badge">STEP 5</text>
    <text x="10" y="52" class="node-title">Auth &amp; Admin</text>

    <text x="10" y="80" class="desc-line">• createsuperuser</text>
    <text x="10" y="102" class="desc-line">• setup_google_oauth</text>
    <text x="10" y="124" class="desc-line">• Sync localhost:8000</text>
    <text x="10" y="146" class="desc-line">• Assign portal roles</text>
    <text x="10" y="168" class="desc-line">• Test permissions</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 825 225 L 845 225" class="arrow" marker-end="url(#lsp-arrow)"/>

  <!-- Step 6: Launch Server -->
  <g transform="translate(845, 95)" filter="url(#lsp-shadow)">
    <rect width="150" height="260" rx="12" fill="url(#lsp-s6)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="10" y="12" width="60" height="18" rx="4" fill="#10b981"/>
    <text x="40" y="24" text-anchor="middle" class="step-badge">STEP 6</text>
    <text x="10" y="52" class="node-title">Start Server</text>

    <text x="10" y="80" class="desc-line">• manage.py runserver</text>
    <text x="10" y="102" class="desc-line">• npm watch:tailwind</text>
    <text x="10" y="124" class="desc-line">• Visit localhost:8000</text>
    <text x="10" y="146" class="desc-line">• Citizen intake live</text>
    <text x="10" y="168" class="desc-line">• Ready to code! 🚀</text>
  </g>
</svg>
