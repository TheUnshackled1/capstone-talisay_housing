<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .layer-tag { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .card-title { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .item-bullet { font-size: 11.5px; font-weight: 500; fill: #334155; }
      .item-desc { font-size: 10.5px; font-weight: 400; fill: #64748b; }
      .flow-arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="sec-l1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="sec-l2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="sec-l3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="sec-l4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <marker id="sec-marker" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <filter id="sec-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1020" height="560" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title Section -->
  <g transform="translate(36, 30)">
    <text x="0" y="22" class="title">Security Architecture Defense Layers</text>
    <text x="0" y="42" class="subtitle">Multi-tier defense-in-depth model safeguarding IHSMS and Talisay City Housing Authority data</text>
  </g>

  <!-- Incoming Traffic Label -->
  <g transform="translate(36, 90)">
    <rect width="948" height="34" rx="8" fill="#1e293b"/>
    <text x="474" y="22" font-size="12" font-weight="600" fill="#f8fafc" text-anchor="middle">
      🌐 Incoming External Requests (Citizen Walk-ins, Staff Portals, Google OAuth, Twilio Webhooks)
    </text>
  </g>

  <!-- Connective flow line -->
  <path d="M 510 124 L 510 148" class="flow-arrow" marker-end="url(#sec-marker)"/>

  <!-- 4 Defense Layer Cards -->
  <!-- Layer 1: Network & Edge Layer -->
  <g transform="translate(36, 150)" filter="url(#sec-shadow)">
    <rect width="222" height="370" rx="12" fill="url(#sec-l1)" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="10" fill="#2563eb"/>
    <text x="49" y="28" class="layer-tag" text-anchor="middle">LAYER 1</text>
    <text x="14" y="58" class="card-title">Network &amp; Edge</text>
    <text x="14" y="74" class="item-desc">Perimeter isolation &amp; traffic integrity</text>

    <g transform="translate(14, 92)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🔒 TLS / HTTPS Termination</text>
      <text x="10" y="38" class="item-desc">Railway edge SSL certificate</text>
    </g>

    <g transform="translate(14, 158)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🛡️ Host Validation</text>
      <text x="10" y="38" class="item-desc">Strict ALLOWED_HOSTS filtering</text>
    </g>

    <g transform="translate(14, 224)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🌐 CSRF Origin Trust</text>
      <text x="10" y="38" class="item-desc">CSRF_TRUSTED_ORIGINS whitelist</text>
    </g>

    <g transform="translate(14, 290)">
      <rect width="194" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">⚡ Proxy SSL Header</text>
      <text x="10" y="38" class="item-desc">SECURE_PROXY_SSL_HEADER</text>
      <text x="10" y="52" class="item-desc">Prevents protocol confusion</text>
    </g>
  </g>

  <!-- Connector L1 -> L2 -->
  <path d="M 258 335 L 278 335" class="flow-arrow" marker-end="url(#sec-marker)"/>

  <!-- Layer 2: Identity & Access Control -->
  <g transform="translate(278, 150)" filter="url(#sec-shadow)">
    <rect width="222" height="370" rx="12" fill="url(#sec-l2)" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="10" fill="#7c3aed"/>
    <text x="49" y="28" class="layer-tag" text-anchor="middle">LAYER 2</text>
    <text x="14" y="58" class="card-title">Identity &amp; Access</text>
    <text x="14" y="74" class="item-desc">Role-gated authentication</text>

    <g transform="translate(14, 92)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">👥 Multi-Portal Role Guards</text>
      <text x="10" y="38" class="item-desc">2nd, 4th Member &amp; Inspector</text>
    </g>

    <g transform="translate(14, 158)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🔑 Google OAuth (allauth)</text>
      <text x="10" y="38" class="item-desc">Cryptographic state verification</text>
    </g>

    <g transform="translate(14, 224)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🛡️ @login_required Decorator</text>
      <text x="10" y="38" class="item-desc">Zero unauthenticated admin routes</text>
    </g>

    <g transform="translate(14, 290)">
      <rect width="194" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🍪 Secure Session Cookie</text>
      <text x="10" y="38" class="item-desc">HttpOnly + LastPortalRole cookie</text>
      <text x="10" y="52" class="item-desc">Protection against session hijack</text>
    </g>
  </g>

  <!-- Connector L2 -> L3 -->
  <path d="M 500 335 L 520 335" class="flow-arrow" marker-end="url(#sec-marker)"/>

  <!-- Layer 3: Application & Document Vault -->
  <g transform="translate(520, 150)" filter="url(#sec-shadow)">
    <rect width="222" height="370" rx="12" fill="url(#sec-l3)" stroke="#a5f3fc" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="10" fill="#0891b2"/>
    <text x="49" y="28" class="layer-tag" text-anchor="middle">LAYER 3</text>
    <text x="14" y="58" class="card-title">Application &amp; Vault</text>
    <text x="14" y="74" class="item-desc">Data sanitization &amp; hardware sandbox</text>

    <g transform="translate(14, 92)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🛡️ Strict CSRF Protection</text>
      <text x="10" y="38" class="item-desc">100% token coverage on POST</text>
    </g>

    <g transform="translate(14, 158)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">📄 PyMuPDF Vault Sanitizer</text>
      <text x="10" y="38" class="item-desc">PDF render &amp; malicious code strip</text>
    </g>

    <g transform="translate(14, 224)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🖨️ DWT Hardware Sandbox</text>
      <text x="10" y="38" class="item-desc">Local scanner client isolation</text>
    </g>

    <g transform="translate(14, 290)">
      <rect width="194" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🔒 Secret Decoupling</text>
      <text x="10" y="38" class="item-desc">Zero secrets in Git codebase</text>
      <text x="10" y="52" class="item-desc">Loaded dynamically via .env</text>
    </g>
  </g>

  <!-- Connector L3 -> L4 -->
  <path d="M 742 335 L 762 335" class="flow-arrow" marker-end="url(#sec-marker)"/>

  <!-- Layer 4: Audit & Accountability -->
  <g transform="translate(762, 150)" filter="url(#sec-shadow)">
    <rect width="222" height="370" rx="12" fill="url(#sec-l4)" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="14" y="14" width="70" height="20" rx="10" fill="#059669"/>
    <text x="49" y="28" class="layer-tag" text-anchor="middle">LAYER 4</text>
    <text x="14" y="58" class="card-title">Audit &amp; Compliance</text>
    <text x="14" y="74" class="item-desc">End-to-end traceability</text>

    <g transform="translate(14, 92)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">📝 Staff Activity Feed</text>
      <text x="10" y="38" class="item-desc">Cross-module action tracking</text>
    </g>

    <g transform="translate(14, 158)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">⚖️ Case Action Timeline</text>
      <text x="10" y="38" class="item-desc">Immutable hearing &amp; order log</text>
    </g>

    <g transform="translate(14, 224)">
      <rect width="194" height="56" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">🏠 Lot Award History</text>
      <text x="10" y="38" class="item-desc">Occupant &amp; blacklist audit</text>
    </g>

    <g transform="translate(14, 290)">
      <rect width="194" height="64" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="10" y="20" class="item-bullet">📱 Twilio SMS Logging</text>
      <text x="10" y="38" class="item-desc">Timestamped beneficiary notices</text>
      <text x="10" y="52" class="item-desc">Delivery status &amp; audit trail</text>
    </g>
  </g>
</svg>
