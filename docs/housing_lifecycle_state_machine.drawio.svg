<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #64748b; }
      .state-tag { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .state-title { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .state-desc { font-size: 11px; font-weight: 400; fill: #475569; line-height: 1.4; }
      .status-pill { font-family: monospace; font-size: 10.5px; font-weight: 600; }
      .flow-arrow { stroke: #94a3b8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .loop-arrow { stroke: #ea580c; stroke-width: 1.8; stroke-dasharray: 4 4; fill: none; stroke-linecap: round; }
      .reject-arrow { stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 4 4; fill: none; stroke-linecap: round; }
    </style>
    <linearGradient id="sm-s1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="sm-s2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="sm-s3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
    <linearGradient id="sm-s4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="sm-s5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="sm-s6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="sm-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="sm-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="sm-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#dc2626"/>
    </marker>
    <filter id="sm-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1020" height="560" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(36, 28)">
    <text x="0" y="22" class="title">Socialized Housing Lifecycle State Machine</text>
    <text x="0" y="42" class="subtitle">Deterministic qualification gates, queue transitions, and post-occupancy monitoring flow</text>
  </g>

  <!-- Row 1: Stages 1, 2, 3 -->
  <!-- Phase 1: Intake -->
  <g transform="translate(36, 95)" filter="url(#sm-shadow)">
    <rect width="280" height="175" rx="10" fill="url(#sm-s1)" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="14" y="14" width="64" height="20" rx="10" fill="#2563eb"/>
    <text x="46" y="28" class="state-tag" text-anchor="middle">PHASE 1</text>
    <text x="14" y="56" class="state-title">Walk-in Intake</text>
    <text x="14" y="74" class="status-pill" fill="#1e40af">status: registered</text>
    <text x="14" y="94" class="state-desc">• Personal &amp; family roster entered</text>
    <text x="14" y="112" class="state-desc">• Generates APP-YYYYMMDD-XXXX</text>
    <text x="14" y="130" class="state-desc">• Categorizes CDRRMO / displacement</text>
    <text x="14" y="148" class="state-desc">• Enters document collection queue</text>
  </g>

  <!-- Connector 1 -> 2 -->
  <path d="M 316 182 L 366 182" class="flow-arrow" marker-end="url(#sm-arrow)"/>

  <!-- Phase 2: Document Vault -->
  <g transform="translate(370, 95)" filter="url(#sm-shadow)">
    <rect width="280" height="175" rx="10" fill="url(#sm-s2)" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="14" y="14" width="64" height="20" rx="10" fill="#7c3aed"/>
    <text x="46" y="28" class="state-tag" text-anchor="middle">PHASE 2</text>
    <text x="14" y="56" class="state-title">Document Collection</text>
    <text x="14" y="74" class="status-pill" fill="#6d28d9">documents_pending → complete</text>
    <text x="14" y="94" class="state-desc">• 7 mandatory requirements verified</text>
    <text x="14" y="112" class="state-desc">• Hardware TWAIN scanner ingestion</text>
    <text x="14" y="130" class="state-desc">• Real-time checklist confirmation</text>
    <text x="14" y="148" class="state-desc">• Handoff to evaluation pipeline</text>
  </g>

  <!-- Connector 2 -> 3 -->
  <path d="M 650 182 L 700 182" class="flow-arrow" marker-end="url(#sm-arrow)"/>

  <!-- Phase 3: Evaluation -->
  <g transform="translate(704, 95)" filter="url(#sm-shadow)">
    <rect width="280" height="175" rx="10" fill="url(#sm-s3)" stroke="#a5f3fc" stroke-width="1.5"/>
    <rect x="14" y="14" width="64" height="20" rx="10" fill="#0891b2"/>
    <text x="46" y="28" class="state-tag" text-anchor="middle">PHASE 3</text>
    <text x="14" y="56" class="state-title">Eligibility Evaluation</text>
    <text x="14" y="74" class="status-pill" fill="#0e7490">under_evaluation</text>
    <text x="14" y="94" class="state-desc">• Income, residency &amp; voter audit</text>
    <text x="14" y="112" class="state-desc">• Decision: APPROVE → Phase 4</text>
    <text x="14" y="130" class="state-desc">• Decision: RETURN → missing docs</text>
    <text x="14" y="148" class="state-desc">• Decision: REJECT → archive with log</text>
  </g>

  <!-- Return Loop from Phase 3 back to Phase 2 (orange) -->
  <path d="M 750 95 L 750 80 L 510 80 L 510 95" class="loop-arrow" marker-end="url(#sm-orange)"/>
  <rect x="580" y="72" width="105" height="16" rx="3" fill="#ffedd5"/>
  <text x="632" y="84" font-size="9" font-weight="600" fill="#ea580c" text-anchor="middle">Needs Documents</text>

  <!-- Connector Phase 3 down to Phase 4 -->
  <path d="M 844 270 L 844 320" class="flow-arrow" marker-end="url(#sm-arrow)"/>

  <!-- Row 2: Stages 4, 5, 6 (Right-to-Left Flow) -->
  <!-- Phase 4: Form Generation -->
  <g transform="translate(704, 325)" filter="url(#sm-shadow)">
    <rect width="280" height="175" rx="10" fill="url(#sm-s4)" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="14" y="14" width="64" height="20" rx="10" fill="#d97706"/>
    <text x="46" y="28" class="state-tag" text-anchor="middle">PHASE 4</text>
    <text x="14" y="56" class="state-title">Form Generation &amp; Signing</text>
    <text x="14" y="74" class="status-pill" fill="#b45309">ready_for_form → form_ready</text>
    <text x="14" y="94" class="state-desc">• Priority-ordered form queue</text>
    <text x="14" y="112" class="state-desc">• PyMuPDF fills 2-page THA form</text>
    <text x="14" y="130" class="state-desc">• Physical sign-off by dept heads</text>
    <text x="14" y="148" class="state-desc">• Signed copy scanned into vault</text>
  </g>

  <!-- Connector 4 -> 5 -->
  <path d="M 704 412 L 654 412" class="flow-arrow" marker-end="url(#sm-arrow)"/>

  <!-- Phase 5: Lot Awarding -->
  <g transform="translate(370, 325)" filter="url(#sm-shadow)">
    <rect width="280" height="175" rx="10" fill="url(#sm-s5)" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="14" y="14" width="64" height="20" rx="10" fill="#059669"/>
    <text x="46" y="28" class="state-tag" text-anchor="middle">PHASE 5</text>
    <text x="14" y="56" class="state-title">Lot Awarding &amp; SMS</text>
    <text x="14" y="74" class="status-pill" fill="#047857">ready_for_lot_award → awarded</text>
    <text x="14" y="94" class="state-desc">• Orientation scheduling &amp; venue</text>
    <text x="14" y="112" class="state-desc">• Automated Twilio SMS alert</text>
    <text x="14" y="130" class="state-desc">• Public lot draw / assignment</text>
    <text x="14" y="148" class="state-desc">• Creates binding LotAward record</text>
  </g>

  <!-- Connector 5 -> 6 -->
  <path d="M 370 412 L 320 412" class="flow-arrow" marker-end="url(#sm-arrow)"/>

  <!-- Phase 6: Monitoring -->
  <g transform="translate(36, 325)" filter="url(#sm-shadow)">
    <rect width="280" height="175" rx="10" fill="url(#sm-s6)" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="14" y="14" width="64" height="20" rx="10" fill="#475569"/>
    <text x="46" y="28" class="state-tag" text-anchor="middle">PHASE 6</text>
    <text x="14" y="56" class="state-title">Post-Occupancy Monitoring</text>
    <text x="14" y="74" class="status-pill" fill="#334155">occupied → monitored / closed</text>
    <text x="14" y="94" class="state-desc">• Unit status: Vacant → Occupied</text>
    <text x="14" y="112" class="state-desc">• 30-day inspection milestones</text>
    <text x="14" y="130" class="state-desc">• Field inspector mobile audits</text>
    <text x="14" y="148" class="state-desc">• Dispute resolution &amp; case filing</text>
  </g>
</svg>
