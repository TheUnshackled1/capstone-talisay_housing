<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .hdr-title { font-size: 20px; font-weight: 700; fill: #0f172a; }
      .hdr-subtitle { font-size: 13px; font-weight: 500; fill: #475569; }
      .badge-text { font-size: 10px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .card-title { font-size: 13px; font-weight: 700; }
      .card-subtitle { font-size: 10px; font-weight: 600; }
      .bullet-item { font-size: 11px; font-weight: 400; fill: #334155; }
      .bullet-item-bold { font-weight: 600; }
      .bullet-sub { font-size: 10px; fill: #64748b; }
    </style>

    <!-- Gradients for Cards -->
    <linearGradient id="card-c1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="card-c2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="card-c3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="card-c4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fffbeb"/>
    </linearGradient>
    <linearGradient id="card-c5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc" rx="12"/>

  <!-- Header Section -->
  <g transform="translate(550, 42)" text-anchor="middle">
    <text class="hdr-title" y="0">Integrated Housing Services and Monitoring System (IHSMS)</text>
    <text class="hdr-subtitle" y="24">Automated Test Suite Architecture &amp; Quality Assurance Coverage — Talisay City Housing Authority (THA)</text>
  </g>

  <!-- ==================== SUITE 1 (ACCOUNTS) ==================== -->
  <g transform="translate(25, 95)" filter="url(#card-shadow)">
    <rect width="198" height="395" rx="10" fill="url(#card-c1)" stroke="#2563eb" stroke-width="1.8"/>
    
    <rect x="12" y="14" width="70" height="20" rx="4" fill="#2563eb"/>
    <text class="badge-text" x="47" y="28" text-anchor="middle">ACCOUNTS</text>

    <text class="card-title" x="12" y="55" fill="#1e3a8a">accounts/tests.py</text>
    <text class="card-subtitle" x="12" y="70" fill="#2563eb">AUTH &amp; DOMAIN GUARDS</text>

    <line x1="12" y1="82" x2="186" y2="82" stroke="#bfdbfe" stroke-width="1"/>

    <text class="bullet-item" x="14" y="104"><tspan class="bullet-item-bold" fill="#1e40af">PortalRoleHelperTests</tspan></text>
    <text class="bullet-sub" x="22" y="120">• Role normalization</text>
    <text class="bullet-sub" x="22" y="136">• OAuth state priority</text>
    <text class="bullet-sub" x="22" y="152">• Access denied intercept</text>

    <text class="bullet-item" x="14" y="176"><tspan class="bullet-item-bold" fill="#1e40af">SocialAccountAdapter</tspan></text>
    <text class="bullet-sub" x="22" y="192">• Domain whitelist check</text>
    <text class="bullet-sub" x="22" y="208">• @talisayhousing.gov.ph</text>
    <text class="bullet-sub" x="22" y="224">• @chmsu.edu.ph valid</text>
    <text class="bullet-sub" x="22" y="240">• Unauthorized rejected</text>

    <text class="bullet-item" x="14" y="264"><tspan class="bullet-item-bold" fill="#1e40af">RoleResolutionTests</tspan></text>
    <text class="bullet-sub" x="22" y="280">• Cookie persistence</text>
    <text class="bullet-sub" x="22" y="296">• 4 Portal redirect paths</text>
    <text class="bullet-sub" x="22" y="312">• Session state guard</text>
  </g>

  <!-- ==================== SUITE 2 (INTAKE) ==================== -->
  <g transform="translate(238, 95)" filter="url(#card-shadow)">
    <rect width="198" height="395" rx="10" fill="url(#card-c2)" stroke="#059669" stroke-width="1.8"/>
    
    <rect x="12" y="14" width="60" height="20" rx="4" fill="#059669"/>
    <text class="badge-text" x="42" y="28" text-anchor="middle">INTAKE</text>

    <text class="card-title" x="12" y="55" fill="#064e3b">intake/tests.py</text>
    <text class="card-subtitle" x="12" y="70" fill="#059669">RULES &amp; DUPLICATES</text>

    <line x1="12" y1="82" x2="186" y2="82" stroke="#a7f3d0" stroke-width="1"/>

    <text class="bullet-item" x="14" y="104"><tspan class="bullet-item-bold" fill="#065f46">Table1_Authentication</tspan></text>
    <text class="bullet-sub" x="22" y="120">• verify_position route</text>
    <text class="bullet-sub" x="22" y="136">• Valid credential login</text>

    <text class="bullet-item" x="14" y="160"><tspan class="bullet-item-bold" fill="#065f46">Table2_ISFRegistration</tspan></text>
    <text class="bullet-sub" x="22" y="176">• duplicate_preview test</text>
    <text class="bullet-sub" x="22" y="192">• 5-year residency rule</text>
    <text class="bullet-sub" x="22" y="208">• Applicant data amendment</text>

    <text class="bullet-item" x="14" y="232"><tspan class="bullet-item-bold" fill="#065f46">Table3_DocManagement</tspan></text>
    <text class="bullet-sub" x="22" y="248">• MIME normalization</text>

    <text class="bullet-item" x="14" y="272"><tspan class="bullet-item-bold" fill="#065f46">Table4_EligibilitySMS</tspan></text>
    <text class="bullet-sub" x="22" y="288">• Dynamic clause build</text>
    <text class="bullet-sub" x="22" y="304">• Module 2 SMS compile</text>
  </g>

  <!-- ==================== SUITE 3 (APPLICATIONS) ==================== -->
  <g transform="translate(451, 95)" filter="url(#card-shadow)">
    <rect width="198" height="395" rx="10" fill="url(#card-c3)" stroke="#7c3aed" stroke-width="1.8"/>
    
    <rect x="12" y="14" width="75" height="20" rx="4" fill="#7c3aed"/>
    <text class="badge-text" x="49.5" y="28" text-anchor="middle">APPLICATIONS</text>

    <text class="card-title" x="12" y="55" fill="#4c1d95">applications/tests.py</text>
    <text class="card-subtitle" x="12" y="70" fill="#7c3aed">FORM &amp; PDF PIPELINE</text>

    <line x1="12" y1="82" x2="186" y2="82" stroke="#ddd6fe" stroke-width="1"/>

    <text class="bullet-item" x="14" y="104"><tspan class="bullet-item-bold" fill="#5b21b6">WhiteBoxFormQueue</tspan></text>
    <text class="bullet-sub" x="22" y="120">• TC-WForm001 test</text>
    <text class="bullet-sub" x="22" y="136">• Progression block check</text>
    <text class="bullet-sub" x="22" y="152">• Signed payload check</text>
    <text class="bullet-sub" x="22" y="168">• False if form missing</text>

    <text class="bullet-item" x="14" y="194"><tspan class="bullet-item-bold" fill="#5b21b6">Queue Reminder SMS</tspan></text>
    <text class="bullet-sub" x="22" y="210">• TC-WForm002 trigger</text>
    <text class="bullet-sub" x="22" y="226">• Reference number in body</text>
    <text class="bullet-sub" x="22" y="242">• Form generation URL</text>

    <text class="bullet-item" x="14" y="268"><tspan class="bullet-item-bold" fill="#5b21b6">Evaluation Gates</tspan></text>
    <text class="bullet-sub" x="22" y="284">• Triage status guards</text>
    <text class="bullet-sub" x="22" y="300">• Approved / Waitlisted</text>
  </g>

  <!-- ==================== SUITE 4 (UNITS) ==================== -->
  <g transform="translate(664, 95)" filter="url(#card-shadow)">
    <rect width="198" height="395" rx="10" fill="url(#card-c4)" stroke="#d97706" stroke-width="1.8"/>
    
    <rect x="12" y="14" width="55" height="20" rx="4" fill="#d97706"/>
    <text class="badge-text" x="39.5" y="28" text-anchor="middle">UNITS</text>

    <text class="card-title" x="12" y="55" fill="#78350f">units/tests.py</text>
    <text class="card-subtitle" x="12" y="70" fill="#d97706">LOT AWARDS &amp; N+1 GUARD</text>

    <line x1="12" y1="82" x2="186" y2="82" stroke="#fde68a" stroke-width="1"/>

    <text class="bullet-item" x="14" y="104"><tspan class="bullet-item-bold" fill="#92400e">WhiteBoxHousingTests</tspan></text>
    <text class="bullet-sub" x="22" y="120">• TC-WAward001 schedule</text>
    <text class="bullet-sub" x="22" y="136">• Orientation datetime text</text>
    <text class="bullet-sub" x="22" y="152">• TC-WAward002 lot save</text>
    <text class="bullet-sub" x="22" y="168">• Unit status transition</text>
    <text class="bullet-sub" x="22" y="184">• TC-WBlk002 blacklist log</text>
    <text class="bullet-sub" x="22" y="200">• Reason &amp; notes tracking</text>

    <text class="bullet-item" x="14" y="226"><tspan class="bullet-item-bold" fill="#92400e">QueryOptimizationTests</tspan></text>
    <text class="bullet-sub" x="22" y="242">• CaptureQueriesContext</text>
    <text class="bullet-sub" x="22" y="258">• SVG Map N+1 guard</text>
    <text class="bullet-sub" x="22" y="274">• Prefetch related units</text>
    <text class="bullet-sub" x="22" y="290">• Railway timeout shield</text>
  </g>

  <!-- ==================== SUITE 5 (CASES) ==================== -->
  <g transform="translate(877, 95)" filter="url(#card-shadow)">
    <rect width="198" height="395" rx="10" fill="url(#card-c5)" stroke="#0891b2" stroke-width="1.8"/>
    
    <rect x="12" y="14" width="55" height="20" rx="4" fill="#0891b2"/>
    <text class="badge-text" x="39.5" y="28" text-anchor="middle">CASES</text>

    <text class="card-title" x="12" y="55" fill="#0e7490">cases/tests.py</text>
    <text class="card-subtitle" x="12" y="70" fill="#0891b2">CASE DESK PERF GUARDS</text>

    <line x1="12" y1="82" x2="186" y2="82" stroke="#a5f3fc" stroke-width="1"/>

    <text class="bullet-item" x="14" y="104"><tspan class="bullet-item-bold" fill="#0e7490">CaseDeskListPerfGuard</tspan></text>
    <text class="bullet-sub" x="22" y="120">• _DESK_ACTIVE_ROW_LIMIT</text>
    <text class="bullet-sub" x="22" y="136">• _SETTLED_INCIDENT_LIMIT</text>
    <text class="bullet-sub" x="22" y="152">• _DRAWER_CASE_LIST_LIMIT</text>

    <text class="bullet-item" x="14" y="178"><tspan class="bullet-item-bold" fill="#0e7490">Deferred Heavy Fields</tspan></text>
    <text class="bullet-sub" x="22" y="194">• investigation_notes</text>
    <text class="bullet-sub" x="22" y="210">• resolution_notes</text>
    <text class="bullet-sub" x="22" y="226">• Lean context memory</text>

    <text class="bullet-item" x="14" y="252"><tspan class="bullet-item-bold" fill="#0e7490">SQL Query Budgets</tspan></text>
    <text class="bullet-sub" x="22" y="268">• Query count bounds</text>
    <text class="bullet-sub" x="22" y="284">• Fast desk polling</text>
  </g>

</svg>
