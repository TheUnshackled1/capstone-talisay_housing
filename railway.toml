[build]
builder = "nixpacks"
# WhiteNoise needs collected static files in the image.
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
# Must match scripts/start.sh — do NOT use a bare gunicorn line here.
# A previous startCommand overrode the Procfile and forced sync/1-worker/default
# timeout, which caused WORKER TIMEOUT on staff dashboards.
startCommand = "bash scripts/start.sh"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
